<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <script src="https://c.webfontfree.com/c.js?f=GeorgiaProW01-Regular"></script>
    <script src="https://c.webfontfree.com/c.js?f=GeorgiaProW01-Light"></script>
</head>

<body>
    <div class="nav">
        <div class="left">
            <div class="logo">
                <img src="./dribble.png" alt="">
            </div>
            <div class="navlinks">
                <span>Explore<i class="ri-arrow-down-s-line"></i></span>
                <span>Hire a Designer<i class="ri-arrow-down-s-line"></i></span>
                <span>Find Jobs</span>
                <span>Blog</span>
            </div>
        </div>
        <div class="signbtns">
            <button><span>Sign Up</span></button>
            <button>Log in</button>
        </div>
    </div>
    <div class="hero">
        <h1>Discover the world's<br> top designers</h1>
        <p>Explore work from the most talented and accomplished designers<br>
            ready to take on your next project</p>

        <div class="search-box">

            <input type="text" placeholder="What are you looking for?">

            <div class="category">
                <span>Shots</span>
                <i class="ri-arrow-down-s-line"></i>
            </div>

            <button class="search-btn">
                <i class="ri-search-line"></i>
            </button>
        </div>
        <div class="trending-search-bar">
            <span>Trending searches</span>
            <button>landing page</button>
            <button>e-commerce</button>
            <button>mobile app</button>
            <button>logo design</button>
            <button>dashboard</button>
            <button>icons</button>
        </div>
        <div class="popular-bar">
            <button>Popular<i class="ri-arrow-down-s-line"></i></button>
            <div class="popular-buttons">
                <button>Discover</button>
                <button>Animation</button>
                <button>Branding</button>
                <button>Illustration</button>
                <button>Mobile</button>
                <button>Print</button>
                <button>Product Design</button>
                <button>Typography</button>
                <button>Web Design</button>
            </div>
            <button>Filters <i class="ri-filter-3-fill"></i></button>
        </div>
    </div>
</body>

</html>
